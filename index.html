<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏀 投籃機遊戲 - Basketball Game</title>
    <meta
      name="description"
      content="互動式投籃機遊戲，三個關卡挑戰，支援觸控操作"
    />

    <!-- 載入 Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/css/bootstrap.min.css"
      integrity="sha512-fw7f+TcMjTb7bpbLJZlP8g2Y4XcCyFZW8uy8HsRZsH/SwbMw0plKHFHr99DN3l04VsYNwvzicUX/6qurvIxbxw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- 載入自定義樣式 -->
    <link rel="stylesheet" href="styles.css" />

    <!-- 預載入 LCP 相關圖片 -->
    <link rel="preload" as="image" href="frame.png" fetchpriority="high" />
    <link rel="preload" as="image" href="basket.png" fetchpriority="high" />

    <!-- 避免 favicon 404 -->
    <link rel="icon" href="data:," />
  </head>

  <body>
    <!-- 遊戲主容器 -->
    <main class="container" role="main" aria-label="投籃機遊戲畫面">
      <!-- 遊戲頭部信息 -->
      <header class="game-header">
        <h1 class="visually-hidden">投籃機遊戲 - Basketball Game</h1>
        <div class="score" role="region" aria-label="遊戲狀態數據">
          <h3 class="score-badge score-level">
            <span class="badge-label">關卡:</span>
            <span class="badge-value" id="level">1</span>
          </h3>
          <h3 class="score-badge score-points">
            <span class="badge-label">分數:</span>
            <span class="badge-value" id="score">0</span>
          </h3>
          <div class="score-badge timer">
            <span class="badge-label">時間:</span>
            <span class="badge-value"><span id="timer">150</span>s</span>
          </div>
          <h3 class="score-badge score-top">
            <span class="badge-label">最高分:</span>
            <span class="badge-value" id="top-score">0</span>
          </h3>
        </div>
      </header>

      <!-- 遊戲元素 -->
      <div class="baseket" role="img" aria-label="籃框"></div>
      <div class="basket-in" id="basket-in" aria-hidden="true"></div>
      <div class="basket-area" id="basket-area" aria-hidden="true"></div>
      <div class="ball" id="ball" role="button" aria-label="籃球，按住拖拽投籃" tabindex="0"></div>
      <svg class="guide-line-svg" id="guide-line" aria-hidden="true">
        <defs>
          <marker
            id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 10 3, 0 6" fill="rgba(255,255,255,0.9)" />
          </marker>
        </defs>
        <path id="guide-line-path" marker-end="url(#arrowhead)" />
      </svg>
      <div class="desk" aria-hidden="true"></div>

      <!-- 力度指示器 -->
      <div class="power-indicator" id="power-indicator" role="progressbar" aria-label="投球力度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="power-bar" id="power-bar"></div>
      </div>

      <!-- 遊戲說明 -->
      <footer class="title" role="contentinfo" aria-label="遊戲操作提示">
        <p>
          拖拽投籃得分！第一關有大籃框幫助練習！<br />
          <small>💡 瞄準籃框頂部投球效果最佳</small>
        </p>
      </footer>
    </main>

    <!-- 遊戲結束模態框 -->
    <div
      class="game-over-modal"
      id="game-over-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="game-over-title"
      aria-hidden="true"
    >
      <div class="modal-content">
        <h2 id="game-over-title">🎉 遊戲結束！</h2>
        <div class="modal-scores">
          <p class="score-row">
            <strong class="stat-label">您的分數:</strong>
            <span id="final-score" class="stat-score-final">0</span>
          </p>
          <p class="score-row">
            <strong class="stat-label">最高分數:</strong>
            <span id="final-top-score" class="stat-score-top">0</span>
          </p>
        </div>
        <p class="game-over-tip">
          💡 技巧：瞄準籃框頂部，連續命中可獲得額外獎勵！
        </p>
        <button
          type="button"
          class="restart-btn"
          onclick="restartGame()"
          aria-label="重新開始遊戲"
        >
          🏀 再玩一次
        </button>
      </div>
    </div>

    <!-- 載入 Bootstrap JS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/js/bootstrap.bundle.min.js"
      integrity="sha512-Tc0i+vRogmX4NN7tuLbQfBxa8JkfUSAxSFVzmU31nVdHyiHElPPy2cWfFacmCJKw0VqovrzKhdd2TSTMdAxp2g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <!-- 載入 jQuery -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <!-- 載入遊戲邏輯 -->
    <script src="game.js" defer></script>
  </body>
</html>
