<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏀 投籃機遊戲 - Basketball Game</title>
    <meta
      name="description"
      content="互動式投籃機遊戲，三個關卡挑戰，支援觸控操作"
    />

    <!-- 預先建立 CDN 連線，加速 jQuery 載入 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- 載入自定義樣式 -->
    <link rel="stylesheet" href="styles.css" />

    <!-- 預載入 LCP 主視覺 -->
    <link rel="preload" as="image" href="frame.png" fetchpriority="high" />

    <!-- 首屏可見的籃框與球，提前到 CSS 載入前開始抓取（優先權低於主視覺） -->
    <link rel="preload" as="image" href="basket.png" fetchpriority="low" />
    <link rel="preload" as="image" href="ball.png" fetchpriority="low" />

    <!-- 避免 favicon 404 -->
    <link rel="icon" href="data:," />
  </head>

  <body>
    <!-- 遊戲主容器 -->
    <main class="container">
      <!-- 遊戲頭部信息 -->
      <header class="game-header">
        <div class="score">
          <h3>關卡: <span id="level">1</span></h3>
          <h3>分數: <span id="score">0</span></h3>
          <div class="timer">時間: <span id="timer">120</span>s</div>
          <h3>最高分: <span id="top-score">0</span></h3>
        </div>
      </header>

      <!-- 遊戲元素 -->
      <div class="baseket" role="img" aria-label="籃框"></div>
      <div class="basket-in" id="basket-in" aria-hidden="true"></div>
      <div class="basket-area" id="basket-area" aria-hidden="true"></div>
      <div
        class="ball"
        id="ball"
        role="button"
        tabindex="0"
        aria-label="籃球，按住並拖曳即可投籃"
      ></div>
      <svg
        class="guide-line-svg"
        id="guide-line"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <marker
            id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 10 3, 0 6" fill="rgba(255,255,255,0.9)" />
          </marker>
        </defs>
        <path id="guide-line-path" marker-end="url(#arrowhead)" />
      </svg>
      <div class="desk" aria-hidden="true"></div>

      <!-- 力度指示器 -->
      <div class="power-indicator" id="power-indicator" aria-hidden="true">
        <div class="power-bar" id="power-bar"></div>
      </div>

      <!-- 遊戲說明 -->
      <div class="title">
        <p>
          拖曳投籃得分！第一關有大籃框幫助練習！<br />
          <small>💡 瞄準籃框頂部投球效果最佳</small>
        </p>
      </div>
    </main>

    <!-- 遊戲結束模態框 -->
    <div
      class="game-over-modal"
      id="game-over-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="game-over-title"
    >
      <div class="modal-content">
        <h2 id="game-over-title">🎉 遊戲結束！</h2>
        <p>
          <strong>您的分數:</strong>
          <span
            id="final-score"
            style="color: #2e7d32; font-size: 24px; font-weight: bold"
            >0</span
          >
        </p>
        <p>
          <strong>最高分數:</strong>
          <span
            id="final-top-score"
            style="color: #c2410c; font-size: 20px; font-weight: bold"
            >0</span
          >
        </p>
        <p style="color: #666; font-size: 14px; margin-top: 15px">
          💡 技巧：瞄準籃框頂部，連續命中可獲得額外獎勵！
        </p>
        <button
          class="restart-btn"
          onclick="restartGame()"
          aria-label="重新開始遊戲"
        >
          🏀 再玩一次
        </button>
      </div>
    </div>

    <!-- 載入 jQuery -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <!-- 載入遊戲邏輯 -->
    <script src="game.js" defer></script>
  </body>
</html>
